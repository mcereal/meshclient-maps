[project]
name = "meshmaps"
version = "0.1.0"
description = "Builds and publishes mesh-client's offline map packs"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pillow>=11",
    "shapely>=2",
]

[project.optional-dependencies]
publish = ["boto3>=1.36"]

[tool.setuptools]
packages = ["meshmaps"]

[tool.ruff]
line-length = 120
