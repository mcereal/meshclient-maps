name: Build packs

# Draws regions and publishes them: by hand for the regions asked for, and every region on the
# second of each month. After a publish, every cut but the newest two of each region is deleted:
# the previous one stays for a client still downloading it.
on:
  workflow_dispatch:
    inputs:
      regions:
        description: "Region ids, space separated, or all (see regions/regions.toml)"
        required: true
        default: "world"
      publish:
        description: "Upload to R2 and rebuild the catalog"
        type: boolean
        default: false
      shards:
        description: "Jobs to spread the regions over"
        default: "40"
  schedule:
    - cron: "0 6 2 * *"

env:
  REGIONS: ${{ inputs.regions || 'all' }}
  PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.list.outputs.shards }}
      planet: ${{ steps.list.outputs.planet }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m venv .venv && .venv/bin/pip install -q -e .
      # One planet for every job, so a run is one cut of the map even when it spans a day.
      - id: list
        env:
          SHARDS: ${{ inputs.shards || '40' }}
        run: |
          # shellcheck disable=SC2086  # REGIONS is a list of ids
          echo "shards=$(.venv/bin/python -m meshmaps shards "$SHARDS" $REGIONS)" >> "$GITHUB_OUTPUT"
          echo "planet=$(.venv/bin/python -c 'from meshmaps import render; print(render.latest_planet()[0])')" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # Every job reads the planet from build.protomaps.com, which throttles and resets streams
      # at 20 at once.
      max-parallel: 10
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: make setup
      # A region that fails does not stop the rest of its shard; the job fails at the end, and
      # the catalog is still rebuilt from whatever did publish.
      - env:
          SHARD: ${{ matrix.shard }}
          PLANET: ${{ needs.plan.outputs.planet }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'meshclient-maps' }}
        run: |
          failed=""
          for region in $SHARD; do
            echo "::group::$region"
            if .venv/bin/python -m meshmaps build "$region" --planet "$PLANET" &&
               { [ "$PUBLISH" != "true" ] || .venv/bin/python -m meshmaps publish --no-catalog "$region"; }; then
              [ "$PUBLISH" != "true" ] || rm -rf "build/work/$region" "dist/$region"
            else
              failed="$failed $region"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::failed:$failed"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && env.PUBLISH != 'true' }}
        with:
          name: shard-${{ strategy.job-index }}
          path: dist/
          retention-days: 7

  catalog:
    needs: build
    if: ${{ always() && needs.build.result != 'skipped' && (github.event_name == 'schedule' || inputs.publish) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m venv .venv && .venv/bin/pip install -q -e '.[publish]'
      - env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'meshclient-maps' }}
        run: |
          .venv/bin/python -m meshmaps publish-catalog
          .venv/bin/python -m meshmaps prune --keep 2
